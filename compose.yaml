services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: activities
      POSTGRES_USER: activities
      POSTGRES_PASSWORD: activities
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activities"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_activities &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: activities
      POSTGRES_USER: activities
      POSTGRES_PASSWORD: activities
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-in-production-32b}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: pnpm dev --host 0.0.0.0
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
  pgdata: