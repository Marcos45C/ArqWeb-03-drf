services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: activities
      POSTGRES_USER: activities
      POSTGRES_PASSWORD: activities
    volumes:
      - pgdata_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activities"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_activities &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      POSTGRES_DB: activities
      POSTGRES_USER: activities
      POSTGRES_PASSWORD: activities
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
    volumes:
      - frontend_dist:/app/dist

  proxy:
    image: nginx:alpine
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  pgdata_prod:
  frontend_dist: